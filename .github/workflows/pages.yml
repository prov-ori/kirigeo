name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Собрать сайт (без служебных файлов)
        run: |
          mkdir _site
          cp -r index.html 404.html hub.css hub.js stats.js logo.svg og-image.png .nojekyll kirjandus geo _site/
          rm -rf _site/geo/tests _site/geo/scripts _site/geo/*.mjs _site/geo/package.json _site/geo/vercel.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
